<!DOCTYPE html>
<html lang="en">
<head>

  <title>Excursion</title>
  <link rel="stylesheet" href="resources/css/style.css">
</head>
<body>

    <h1>Discover hidden places in the world around you</h1>

    <p class="download-link">
      <a href="#">Download Excursion (Coming soon!)</a>

    <section class="video-section" aria-label="Excursion app preview">
      <video autoplay muted loop playsinline>
        <source src="resources/videos/excursion.mp4" type="video/mp4">
        <source src="https://content.codecademy.com/programs/freelance-one/excursion/videos/excursion.mp4" type="video/mp4">

    </section>

    <section>
      <p class="media-block">
        <img class="phone-icon" src="resources/images/phone.png" alt="Phone icon">
      </p>

      <h2>Coming Soon for iPhone and Android</h2>

      <p class="download-link">
        <a href="#">Download Excursion (Coming soon!)</a>
      </p>

  <footer>
    <p>© Excursion</p>
  </footer>
